<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Nexus // Interface</title>
    <!-- LOCAL CSS ONLY - No CDN -->
    <link href="css/app.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Login container */
        .login-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: white;
        }
        
        .login-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(127, 29, 29, 0.1), #050505, #050505);
            pointer-events: none;
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo-section {
            margin-bottom: 2.5rem;
            text-align: center;
        }
        
        .logo-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 1.5rem;
            background: rgba(30, 30, 30, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px -10px rgba(220, 38, 38, 0.3);
            backdrop-filter: blur(12px);
        }
        
        .logo-box svg {
            width: 40px;
            height: 40px;
            color: #dc2626;
            filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.8));
        }
        
        .app-title {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }
        
        .app-subtitle {
            color: #6b7280;
            font-size: 0.875rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
        }
        
        /* Form */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        
        .form-input {
            width: 100%;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 1rem 1rem 1rem 3rem;
            font-size: 0.875rem;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-input:focus {
            border-color: rgba(220, 38, 38, 0.5);
        }
        
        .form-input::placeholder {
            color: #6b7280;
        }
        
        .submit-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 15px;
            background: #dc2626;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(127, 29, 29, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .submit-btn:hover {
            background: #ef4444;
        }
        
        .submit-btn:active {
            transform: scale(0.98);
        }
        
        .submit-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .disclaimer {
            margin-top: 2rem;
            text-align: center;
            font-size: 10px;
            color: #4b5563;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 12, 15, 0.9);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(220, 38, 38, 0.3);
            border-radius: 50%;
            border-top-color: #dc2626;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loader-text {
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: #dc2626;
            letter-spacing: 0.15em;
        }
        
        /* App iframe (hidden initially) */
        .app-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    
    <!-- Login Screen (LOCAL - no network needed) -->
    <div id="loginScreen" class="login-screen animate-fade-in">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-box animate-pulse-glow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8V4H8"></path>
                        <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                        <path d="M2 14h2"></path>
                        <path d="M20 14h2"></path>
                        <path d="M15 13v2"></path>
                        <path d="M9 13v2"></path>
                    </svg>
                </div>
                <h1 class="app-title">Dark AI</h1>
                <p class="app-subtitle">UNRESTRICTED ACCESS TERMINAL</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <input type="email" id="email" class="form-input input-capsule" placeholder="Agent Identity (Email)" required>
                <input type="password" id="password" class="form-input input-capsule" placeholder="Passcode" required>
                <button type="submit" class="submit-btn">
                    INITIALIZE SESSION
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>
            </form>
            
            <div class="disclaimer">
                BY ACCESSING THIS TERMINAL, YOU ACCEPT FULL RESPONSIBILITY.<br>
                SYSTEM V2.6 // ENCRYPTED
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loader" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loader-text">ESTABLISHING UPLINK...</div>
    </div>

    <!-- App Iframe (loads ONLY after login) -->
    <iframe id="appFrame" class="app-frame" allow="clipboard-read; clipboard-write"></iframe>

    <script>
        // Check if already logged in
        if (localStorage.getItem('darkAI_loggedIn') === 'true') {
            // Skip login, load app directly
            document.getElementById('loginScreen').style.display = 'none';
            var frame = document.getElementById('appFrame');
            frame.style.display = 'block';
            frame.src = 'https://dark-ai-beta.vercel.app/';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loader
            document.getElementById('loader').style.display = 'flex';
            
            // Save login state
            localStorage.setItem('darkAI_loggedIn', 'true');
            
            // Load the app in iframe
            setTimeout(function() {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('loader').style.display = 'none';
                var frame = document.getElementById('appFrame');
                frame.style.display = 'block';
                frame.src = 'https://dark-ai-beta.vercel.app/';
            }, 800);
        });
    </script>
</body>
</html>
