<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Nexus // Interface</title>
    <!-- Tailwind CSS CDN (For structural utils) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="assets/style.css" rel="stylesheet">
    <style>
        .loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(11, 12, 15, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: none;
            align-items: center; justify-content: center;
            flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(220, 38, 38, 0.3);
            border-radius: 50%;
            border-top-color: #dc2626;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#0b0c0f] text-white overflow-hidden">
    
    <!-- Shell/Login UI -->
    <div id="root">
        <div class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-[#050505] text-white">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-red-900/10 via-[#050505] to-[#050505] pointer-events-none"></div>
            <div class="w-full max-w-[400px] p-8 relative z-10 flex flex-col items-center animate-fade-in">
                <div class="mb-10 text-center">
                    <div class="w-20 h-20 mx-auto rounded-3xl bg-[#1e1e1e]/40 border border-white/5 flex items-center justify-center mb-6 shadow-[0_0_40px_-10px_rgba(220,38,38,0.3)] backdrop-blur-md animate-pulse-glow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bot w-10 h-10 text-red-600 drop-shadow-[0_0_10px_rgba(220,38,38,0.8)]"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight mb-2">Dark AI</h1>
                    <p class="text-gray-500 text-sm font-mono tracking-wide">UNRESTRICTED ACCESS TERMINAL</p>
                </div>
                
                <form id="loginForm" class="w-full space-y-5">
                    <div class="space-y-1.5">
                        <div class="relative group">
                            <input type="email" id="email" class="w-full bg-[#111] border border-white/10 rounded-xl py-4 pl-12 pr-4 text-sm text-white focus:border-red-500/50 focus:outline-none transition-all input-capsule" placeholder="Agent Identity (Email)">
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <div class="relative group">
                            <input type="password" id="password" class="w-full bg-[#111] border border-white/10 rounded-xl py-4 pl-12 pr-12 text-sm text-white focus:border-red-500/50 focus:outline-none transition-all input-capsule" placeholder="Passcode">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-4 rounded-xl font-bold text-[15px] bg-red-600 text-white hover:bg-red-500 transition-all shadow-lg shadow-red-900/20">INITIALIZE SESSION</button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-[10px] text-gray-600 font-mono">BY ACCESSING THIS TERMINAL, YOU ACCEPT FULL RESPONSIBILITY.<br>SYSTEM V2.6 // ENCRYPTED</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loader" class="loading-overlay">
        <div class="spinner mb-4"></div>
        <div class="text-xs font-mono text-red-500 tracking-widest">ESTABLISHING UPLINK...</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loader
            document.getElementById('loader').style.display = 'flex';
            
            // Get credentials (optional: store for pre-filling)
            const email = document.getElementById('email').value;
            // localStorage.setItem('last_email', email); 
            
            // Simulate minimal delay then redirect to real app
            setTimeout(() => {
                // Redirect to the real app URL
                window.location.href = "https://dark-ai-beta.vercel.app/";
            }, 800);
        });

        // Pre-fill email if saved
        // if(localStorage.getItem('last_email')) {
        //     document.getElementById('email').value = localStorage.getItem('last_email');
        // }
    </script>
</body>
</html>
